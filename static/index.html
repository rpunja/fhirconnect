<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHIRConnect · Patients</title>
<style>
  :root {
    --bg: #F4F7FB; --surface: #FFFFFF; --text: #0F1B2D;
    --text-muted: #5B6B82; --border: #E3E9F2;
    --accent: #0E7C86; --accent-soft: #E3F4F5; --accent-fg: #FFFFFF;
    --primary-action: #0E7C86; --primary-action-fg: #FFFFFF;
    --header-bg: #0B2540;
    --male: #2F6FED; --male-soft: #E6EEFE; --female: #C2417E; --female-soft: #FBE8F1;
    --other: #7A5AF8; --other-soft: #EFEBFE; --unknown: #6B7A90; --unknown-soft: #EEF1F5;
    --danger: #C62828; --ok: #1E7F4F;
    --radius: 12px; --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15,27,45,.04), 0 4px 16px rgba(15,27,45,.06);
    --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
  header { background: var(--header-bg); color: #fff; }
  .header-inner { max-width: 1180px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
  .brand h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12.5px; color: rgba(255,255,255,.65); }
  .server { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,.8);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); padding: 5px 10px; border-radius: 999px; }
  .server::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3DDC97; }
  .server:empty { display: none; }
  .stats { max-width: 1180px; margin: 0 auto; padding: 22px 24px 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; border-top: 3px solid var(--accent); }
  .stat .label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
  .stat .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.male { border-top-color: var(--male); } .stat.female { border-top-color: var(--female); } .stat.other { border-top-color: var(--other); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 24px; display: grid; gap: 22px;
    grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .form-panel { position: sticky; top: 20px; }
  @media (max-width: 900px) { .form-panel { position: static; } }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .panel-head h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .panel-head .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .panel-body { padding: 18px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: #FBFCFE; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #fff; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(198,40,40,.1); }
  .search-wrap { position: relative; flex: 1 1 240px; max-width: 340px; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-wrap input { padding-left: 34px; border-radius: 999px; }
  button { padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; transition: background .15s, border-color .15s, color .15s; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--primary-action); color: var(--primary-action-fg); border-color: var(--primary-action); padding: 10px 18px; }
  button.primary:hover { filter: brightness(1.08); color: var(--primary-action-fg); }
  button.edit { padding: 6px 12px; font-size: 13px; background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  button.edit:hover { background: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 600; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; background: #F9FBFD; }
  tbody tr { transition: background .12s; }
  tbody tr:hover td { background: #F7FAFD; }
  tr:last-child td { border-bottom: 0; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px;
    background: var(--unknown-soft); color: var(--unknown); }
  .avatar.male { background: var(--male-soft); color: var(--male); } .avatar.female { background: var(--female-soft); color: var(--female); }
  .avatar.other { background: var(--other-soft); color: var(--other); }
  .who .name { font-weight: 600; } .who .id { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--unknown-soft); color: var(--unknown); }
  .pill.male { background: var(--male-soft); color: var(--male); } .pill.female { background: var(--female-soft); color: var(--female); }
  .pill.other { background: var(--other-soft); color: var(--other); }
  .dob { font-variant-numeric: tabular-nums; } .dob .age { color: var(--text-muted); font-size: 12.5px; }
  td.actions { text-align: right; width: 1%; white-space: nowrap; }
  tr.editing td { background: var(--accent-soft) !important; }
  .muted { color: var(--text-muted); }
  .status { padding: 28px 18px; font-size: 14px; text-align: center; color: var(--text-muted); }
  .status.error { color: var(--danger); }
  .table-wrap { overflow-x: auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field .err { color: var(--danger); font-size: 12.5px; margin-top: 4px; }
  .field .err:empty { display: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions .primary { flex: 1; }
  .banner { padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13.5px; margin-bottom: 14px; }
  .banner.error { color: var(--danger); background: rgba(198,40,40,.07); }
  .banner.ok { color: var(--ok); background: rgba(30,127,79,.08); }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--text-muted); background: #F9FBFD; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 28px; font-size: 12.5px; color: var(--text-muted); }
  footer a { color: var(--text-muted); }
  @media (max-width: 640px) {
    .header-inner, .stats, main, footer { padding-left: 14px; padding-right: 14px; }
    thead { display: none; }
    table, tbody { display: block; }
    tbody tr { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: 0; }
    tbody td { display: block; padding: 0; border: 0; background: none !important; }
    tbody td:first-child { grid-column: 1 / -1; }
    tr.editing { background: var(--accent-soft); }
    .who .id { word-break: break-all; }
    .dob { display: flex; gap: 6px; align-items: baseline; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
      </div>
      <div><h1>FHIRConnect</h1><p>Patient management · FHIR R4</p></div>
    </div>
    <span class="server" id="server" title="Connected FHIR server"></span>
  </div>
</header>

<section class="stats" aria-label="Patient summary">
  <div class="stat"><div class="label">Patients</div><div class="value" id="stat-total">–</div></div>
  <div class="stat female"><div class="label">Female</div><div class="value" id="stat-female">–</div></div>
  <div class="stat male"><div class="label">Male</div><div class="value" id="stat-male">–</div></div>
  <div class="stat other"><div class="label">Other / unknown</div><div class="value" id="stat-other">–</div></div>
</section>

<main>
  <section class="panel" aria-labelledby="list-title">
    <div class="panel-head">
      <div><h2 id="list-title">Patient directory</h2><div class="sub">Live from the FHIR server</div></div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search by name…" aria-label="Search patients by name" autocomplete="off">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Patient</th><th>Gender</th><th>Date of birth</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="status" id="list-status" role="status"></div>
    <div class="foot"><span id="count"></span><button id="refresh" type="button">Refresh</button></div>
  </section>

  <section class="panel form-panel" aria-labelledby="form-title">
    <div class="panel-head"><div><h2 id="form-title">New patient</h2><div class="sub" id="form-sub">Creates a Patient resource on the server</div></div></div>
    <form class="panel-body" id="form" novalidate>
      <div id="form-banner" role="alert"></div>
      <div class="row">
        <div class="field">
          <label for="given">Given name</label>
          <input id="given" name="given" autocomplete="off" maxlength="100">
          <div class="err" id="given-err"></div>
        </div>
        <div class="field">
          <label for="family">Family name</label>
          <input id="family" name="family" autocomplete="off" maxlength="100">
          <div class="err" id="family-err"></div>
        </div>
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Select…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="unknown">Unknown</option>
        </select>
        <div class="err" id="gender-err"></div>
      </div>
      <div class="field">
        <label for="birthDate">Date of birth</label>
        <input id="birthDate" name="birthDate" type="date" min="1900-01-01">
        <div class="err" id="birthDate-err"></div>
      </div>
      <div class="form-actions">
        <button class="primary" id="submit" type="submit">Create patient</button>
        <button id="cancel" type="button" hidden>Cancel edit</button>
      </div>
    </form>
  </section>
</main>

<footer><a href="https://app.devin.ai/sessions/2f8a07da0214438bb9b1404f2f717dad" target="_blank" rel="noopener">Request changes</a></footer>

<script>
const PAGE_SIZE = 50;
const MAX_PAGES = 40;
const $ = (id) => document.getElementById(id);
let editing = null;      // Patient resource currently being edited
let listToken = 0;       // guards against out-of-order list responses

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Accept": "application/fhir+json", ...(options.body ? { "Content-Type": "application/fhir+json" } : {}) },
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON */ }
  if (!res.ok) throw new Error(describeError(res.status, data, text));
  return data;
}

function describeError(status, data, text) {
  const issues = data && data.resourceType === "OperationOutcome" ? data.issue || [] : [];
  const msg = issues.map(i => i.diagnostics || (i.details && i.details.text) || i.code).filter(Boolean).join("; ");
  if (status === 401 || status === 403) return `Not authorized by the FHIR server (${status}). ${msg}`.trim();
  return `FHIR server returned ${status}${msg ? ": " + msg : text && !data ? ": " + text.slice(0, 200) : ""}`;
}

function displayName(p) {
  const names = p.name || [];
  const n = names.find(x => x.use === "official") || names.find(x => x.use === "usual") || names[0];
  if (!n) return "";
  const parts = [...(n.given || []), n.family].filter(Boolean).join(" ");
  return parts || n.text || "";
}

function primaryName(p) {
  const names = p.name || [];
  return names.find(x => x.use === "official") || names.find(x => x.use === "usual") || names[0] || null;
}

async function loadPatients() {
  const token = ++listToken;
  const term = $("search").value.trim();
  const params = new URLSearchParams({ _count: PAGE_SIZE });
  if (term) params.set("name", term);
  setStatus("Loading patients…");
  $("count").textContent = "";
  try {
    let bundle = await api(`/api/Patient?${params}`);
    const patients = [];
    let pages = 0, total = bundle.total;
    while (bundle) {
      if (token !== listToken) return;
      for (const e of bundle.entry || []) if (e.resource && e.resource.resourceType === "Patient") patients.push(e.resource);
      renderRows(patients);
      const next = (bundle.link || []).find(l => l.relation === "next");
      if (!next || ++pages >= MAX_PAGES) { bundle = null; break; }
      setStatus(`Loading patients… ${patients.length} so far`);
      bundle = await api(`/api/next?url=${encodeURIComponent(next.url)}`);
    }
    if (token !== listToken) return;
    const capped = typeof total === "number" && total > patients.length;
    setStatus(patients.length ? "" : term ? `No patients match “${term}”.` : "No patients on this server yet.");
    $("count").textContent = `${patients.length} patient${patients.length === 1 ? "" : "s"}` +
      (capped ? ` shown of ${total} (refine your search to narrow)` : "");
  } catch (err) {
    if (token !== listToken) return;
    setStatus(err.message, true);
  }
}

function setStatus(text, isError = false) {
  const el = $("list-status");
  el.textContent = text;
  el.className = "status" + (isError ? " error" : "");
  el.hidden = !text;
}

function initials(p) {
  const n = primaryName(p) || {};
  const a = ((n.given || [])[0] || "")[0] || "";
  const b = (n.family || "")[0] || "";
  return (a + b).toUpperCase() || "?";
}

function age(birthDate) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birthDate || "")) return null;
  const [y, m, d] = birthDate.split("-").map(Number);
  const now = new Date();
  let a = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) a--;
  return a >= 0 && a < 150 ? a : null;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderStats(patients) {
  const count = (g) => patients.filter(p => p.gender === g).length;
  $("stat-total").textContent = patients.length;
  $("stat-female").textContent = count("female");
  $("stat-male").textContent = count("male");
  $("stat-other").textContent = patients.length - count("female") - count("male");
}

function renderRows(patients) {
  renderStats(patients);
  const tbody = $("rows");
  tbody.innerHTML = "";
  for (const p of patients) {
    const tr = document.createElement("tr");
    tr.dataset.id = p.id;
    if (editing && editing.id === p.id) tr.className = "editing";
    const g = GENDERS.includes(p.gender) ? p.gender : "unknown";

    const who = el("div", "who");
    who.appendChild(el("div", "avatar " + g, initials(p)));
    const txt = el("div");
    txt.appendChild(el("div", "name" + (displayName(p) ? "" : " muted"), displayName(p) || "(no name)"));
    txt.appendChild(el("div", "id", p.id));
    who.appendChild(txt);
    const td1 = el("td"); td1.appendChild(who); tr.appendChild(td1);

    const td2 = el("td");
    td2.appendChild(el("span", "pill " + g, p.gender ? p.gender[0].toUpperCase() + p.gender.slice(1) : "Not set"));
    tr.appendChild(td2);

    const td3 = el("td", "dob");
    td3.appendChild(el("div", "", p.birthDate || "—"));
    const a = age(p.birthDate);
    if (a != null) td3.appendChild(el("div", "age", `${a} yr${a === 1 ? "" : "s"}`));
    tr.appendChild(td3);

    const td4 = el("td", "actions");
    const btn = el("button", "edit", "Edit");
    btn.type = "button";
    btn.setAttribute("aria-label", `Edit ${displayName(p) || p.id}`);
    btn.addEventListener("click", () => startEdit(p.id));
    td4.appendChild(btn);
    tr.appendChild(td4);
    tbody.appendChild(tr);
  }
}

// ---------- Form ----------
const NAME_RE = /^[\p{L}\p{M}][\p{L}\p{M}' .\-]*$/u;
const GENDERS = ["male", "female", "other", "unknown"];

function validate() {
  const v = {
    given: $("given").value.trim().replace(/\s+/g, " "),
    family: $("family").value.trim().replace(/\s+/g, " "),
    gender: $("gender").value,
    birthDate: $("birthDate").value,
  };
  const errors = {};
  if (!v.given) errors.given = "Given name is required.";
  else if (!NAME_RE.test(v.given)) errors.given = "Use letters, spaces, hyphens or apostrophes.";
  if (!v.family) errors.family = "Family name is required.";
  else if (!NAME_RE.test(v.family)) errors.family = "Use letters, spaces, hyphens or apostrophes.";
  if (!GENDERS.includes(v.gender)) errors.gender = "Select a gender.";
  if (!v.birthDate) errors.birthDate = "Date of birth is required.";
  else {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v.birthDate);
    const d = m && new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    const today = new Date().toISOString().slice(0, 10);
    if (!d || d.toISOString().slice(0, 10) !== v.birthDate) errors.birthDate = "Enter a valid date.";
    else if (v.birthDate > today) errors.birthDate = "Date of birth can't be in the future.";
    else if (v.birthDate < "1900-01-01") errors.birthDate = "Date of birth must be 1900 or later.";
  }
  for (const f of ["given", "family", "gender", "birthDate"]) {
    $(f + "-err").textContent = errors[f] || "";
    $(f).setAttribute("aria-invalid", errors[f] ? "true" : "false");
  }
  return Object.keys(errors).length ? null : v;
}

function buildPatient(v, existing) {
  const given = v.given.split(" ");
  if (!existing) {
    return { resourceType: "Patient", name: [{ use: "official", family: v.family, given }], gender: v.gender, birthDate: v.birthDate };
  }
  // Keep everything else on the resource (identifiers, telecom, extensions, …) intact.
  const p = structuredClone(existing);
  delete p.meta;
  delete p.text;
  p.name = p.name && p.name.length ? p.name : [];
  const n = primaryName(p);
  if (n) {
    n.family = v.family; n.given = given; delete n.text;
  } else {
    p.name.push({ use: "official", family: v.family, given });
  }
  p.gender = v.gender;
  p.birthDate = v.birthDate;
  return p;
}

function banner(text, kind) {
  $("form-banner").innerHTML = "";
  if (!text) return;
  const div = document.createElement("div");
  div.className = "banner " + kind;
  div.textContent = text;
  $("form-banner").appendChild(div);
}

async function startEdit(id) {
  banner("", "");
  try {
    const p = await api(`/api/Patient/${encodeURIComponent(id)}`);
    editing = p;
    const n = primaryName(p) || {};
    $("given").value = (n.given || []).join(" ");
    $("family").value = n.family || "";
    $("gender").value = GENDERS.includes(p.gender) ? p.gender : "";
    $("birthDate").value = p.birthDate && /^\d{4}-\d{2}-\d{2}$/.test(p.birthDate) ? p.birthDate : "";
    for (const f of ["given", "family", "gender", "birthDate"]) { $(f + "-err").textContent = ""; $(f).removeAttribute("aria-invalid"); }
    $("form-title").textContent = `Edit ${displayName(p) || "patient"}`;
    $("submit").textContent = "Save changes";
    $("cancel").hidden = false;
    document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("editing", tr.dataset.id === p.id));
    $("form-sub").textContent = "Updates this Patient resource on the server";
    $("given").focus();
    $("form").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    banner(`Could not load patient: ${err.message}`, "error");
  }
}

function resetForm() {
  editing = null;
  $("form").reset();
  for (const f of ["given", "family", "gender", "birthDate"]) { $(f + "-err").textContent = ""; $(f).removeAttribute("aria-invalid"); }
  $("form-title").textContent = "New patient";
  $("form-sub").textContent = "Creates a Patient resource on the server";
  $("submit").textContent = "Create patient";
  $("cancel").hidden = true;
  document.querySelectorAll("#rows tr.editing").forEach(tr => tr.classList.remove("editing"));
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  banner("", "");
  const v = validate();
  if (!v) return;
  const btn = $("submit");
  btn.disabled = true;
  try {
    if (editing) {
      const body = buildPatient(v, editing);
      const saved = await api(`/api/Patient/${encodeURIComponent(editing.id)}`, { method: "PUT", body: JSON.stringify(body) });
      resetForm();
      banner(`Updated ${displayName(saved || body)}.`, "ok");
    } else {
      const saved = await api("/api/Patient", { method: "POST", body: JSON.stringify(buildPatient(v)) });
      resetForm();
      banner(`Created ${displayName(saved || {})}${saved && saved.id ? ` (ID ${saved.id})` : ""}.`, "ok");
    }
    await loadPatients();
  } catch (err) {
    banner(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});

$("cancel").addEventListener("click", () => { resetForm(); banner("", ""); });
$("refresh").addEventListener("click", loadPatients);
let searchTimer;
$("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadPatients, 300); });

api("/api/config").then(c => { $("server").textContent = c.server; }).catch(() => {});
loadPatients();
</script>
</body>
</html>
