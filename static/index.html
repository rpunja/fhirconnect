<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHIRConnect · Patients</title>
<style>
  :root {
    --bg: #FCFCFC; --surface: #FFFFFF; --text: #191919;
    --text-muted: rgba(25,25,25,.56); --border: rgba(0,0,0,.10);
    --accent: #317CFF; --accent-fg: #FFFFFF;
    --primary-action: #317CFF; --primary-action-fg: #FFFFFF;
    --danger: #C62828; --ok: #2E7D32;
    --radius: 6px; --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .server { color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 20px;
    grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .panel-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .panel-body { padding: 14px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }
  .search { flex: 1 1 220px; max-width: 320px; }
  button { padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; }
  button:hover { border-color: rgba(0,0,0,.25); }
  button.primary { background: var(--primary-action); color: var(--primary-action-fg); border-color: var(--primary-action); }
  button:disabled { opacity: .6; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 500; color: var(--text-muted); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
  td.actions { text-align: right; width: 1%; white-space: nowrap; }
  tr.editing td { background: rgba(49,124,255,.06); }
  .muted { color: var(--text-muted); }
  .status { padding: 10px 14px; font-size: 13px; }
  .status.error { color: var(--danger); }
  .table-wrap { overflow-x: auto; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  .field .err { color: var(--danger); font-size: 12px; min-height: 0; margin-top: 3px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-actions { display: flex; gap: 8px; }
  .banner { padding: 8px 10px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; border: 1px solid; }
  .banner.error { color: var(--danger); border-color: rgba(198,40,40,.3); background: rgba(198,40,40,.05); }
  .banner.ok { color: var(--ok); border-color: rgba(46,125,50,.3); background: rgba(46,125,50,.05); }
  .foot { display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 24px; font-size: 12px; color: var(--text-muted); }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>
<header>
  <h1>FHIRConnect · Patients</h1>
  <span class="server" id="server"></span>
</header>

<main>
  <section class="panel" aria-labelledby="list-title">
    <div class="panel-head">
      <h2 id="list-title">Patients</h2>
      <input class="search" id="search" type="search" placeholder="Search by name…" aria-label="Search patients by name" autocomplete="off">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Gender</th><th>Date of birth</th><th>ID</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="status" id="list-status" role="status"></div>
    <div class="foot"><span id="count"></span><button id="refresh" type="button">Refresh</button></div>
  </section>

  <section class="panel" aria-labelledby="form-title">
    <div class="panel-head"><h2 id="form-title">New patient</h2></div>
    <form class="panel-body" id="form" novalidate>
      <div id="form-banner" role="alert"></div>
      <div class="row">
        <div class="field">
          <label for="given">Given name</label>
          <input id="given" name="given" autocomplete="off" maxlength="100">
          <div class="err" id="given-err"></div>
        </div>
        <div class="field">
          <label for="family">Family name</label>
          <input id="family" name="family" autocomplete="off" maxlength="100">
          <div class="err" id="family-err"></div>
        </div>
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Select…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="unknown">Unknown</option>
        </select>
        <div class="err" id="gender-err"></div>
      </div>
      <div class="field">
        <label for="birthDate">Date of birth</label>
        <input id="birthDate" name="birthDate" type="date" min="1900-01-01">
        <div class="err" id="birthDate-err"></div>
      </div>
      <div class="form-actions">
        <button class="primary" id="submit" type="submit">Create patient</button>
        <button id="cancel" type="button" hidden>Cancel edit</button>
      </div>
    </form>
  </section>
</main>

<footer><a href="https://app.devin.ai/sessions/2f8a07da0214438bb9b1404f2f717dad" target="_blank" rel="noopener">Request changes</a></footer>

<script>
const PAGE_SIZE = 50;
const MAX_PAGES = 40;
const $ = (id) => document.getElementById(id);
let editing = null;      // Patient resource currently being edited
let listToken = 0;       // guards against out-of-order list responses

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Accept": "application/fhir+json", ...(options.body ? { "Content-Type": "application/fhir+json" } : {}) },
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON */ }
  if (!res.ok) throw new Error(describeError(res.status, data, text));
  return data;
}

function describeError(status, data, text) {
  const issues = data && data.resourceType === "OperationOutcome" ? data.issue || [] : [];
  const msg = issues.map(i => i.diagnostics || (i.details && i.details.text) || i.code).filter(Boolean).join("; ");
  if (status === 401 || status === 403) return `Not authorized by the FHIR server (${status}). ${msg}`.trim();
  return `FHIR server returned ${status}${msg ? ": " + msg : text && !data ? ": " + text.slice(0, 200) : ""}`;
}

function displayName(p) {
  const names = p.name || [];
  const n = names.find(x => x.use === "official") || names.find(x => x.use === "usual") || names[0];
  if (!n) return "";
  const parts = [...(n.given || []), n.family].filter(Boolean).join(" ");
  return parts || n.text || "";
}

function primaryName(p) {
  const names = p.name || [];
  return names.find(x => x.use === "official") || names.find(x => x.use === "usual") || names[0] || null;
}

async function loadPatients() {
  const token = ++listToken;
  const term = $("search").value.trim();
  const params = new URLSearchParams({ _count: PAGE_SIZE });
  if (term) params.set("name", term);
  setStatus("Loading patients…");
  $("rows").innerHTML = "";
  $("count").textContent = "";
  try {
    let bundle = await api(`/api/Patient?${params}`);
    const patients = [];
    let pages = 0, total = bundle.total;
    while (bundle) {
      if (token !== listToken) return;
      for (const e of bundle.entry || []) if (e.resource && e.resource.resourceType === "Patient") patients.push(e.resource);
      renderRows(patients);
      const next = (bundle.link || []).find(l => l.relation === "next");
      if (!next || ++pages >= MAX_PAGES) { bundle = null; break; }
      setStatus(`Loading patients… ${patients.length} so far`);
      bundle = await api(`/api/next?url=${encodeURIComponent(next.url)}`);
    }
    if (token !== listToken) return;
    const capped = typeof total === "number" && total > patients.length;
    setStatus(patients.length ? "" : term ? `No patients match “${term}”.` : "No patients on this server yet.");
    $("count").textContent = `${patients.length} patient${patients.length === 1 ? "" : "s"}` +
      (capped ? ` shown of ${total} (refine your search to narrow)` : "");
  } catch (err) {
    if (token !== listToken) return;
    setStatus(err.message, true);
  }
}

function setStatus(text, isError = false) {
  const el = $("list-status");
  el.textContent = text;
  el.className = "status" + (isError ? " error" : "");
  el.hidden = !text;
}

function renderRows(patients) {
  const tbody = $("rows");
  tbody.innerHTML = "";
  for (const p of patients) {
    const tr = document.createElement("tr");
    if (editing && editing.id === p.id) tr.className = "editing";
    const cells = [
      [displayName(p) || "(no name)", displayName(p) ? "" : "muted"],
      [p.gender ? p.gender[0].toUpperCase() + p.gender.slice(1) : "—", p.gender ? "" : "muted"],
      [p.birthDate || "—", "mono"],
      [p.id, "mono muted"],
    ];
    for (const [text, cls] of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    const td = document.createElement("td");
    td.className = "actions";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Edit";
    btn.addEventListener("click", () => startEdit(p.id));
    td.appendChild(btn);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

// ---------- Form ----------
const NAME_RE = /^[\p{L}\p{M}][\p{L}\p{M}' .\-]*$/u;
const GENDERS = ["male", "female", "other", "unknown"];

function validate() {
  const v = {
    given: $("given").value.trim().replace(/\s+/g, " "),
    family: $("family").value.trim().replace(/\s+/g, " "),
    gender: $("gender").value,
    birthDate: $("birthDate").value,
  };
  const errors = {};
  if (!v.given) errors.given = "Given name is required.";
  else if (!NAME_RE.test(v.given)) errors.given = "Use letters, spaces, hyphens or apostrophes.";
  if (!v.family) errors.family = "Family name is required.";
  else if (!NAME_RE.test(v.family)) errors.family = "Use letters, spaces, hyphens or apostrophes.";
  if (!GENDERS.includes(v.gender)) errors.gender = "Select a gender.";
  if (!v.birthDate) errors.birthDate = "Date of birth is required.";
  else {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v.birthDate);
    const d = m && new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    const today = new Date().toISOString().slice(0, 10);
    if (!d || d.toISOString().slice(0, 10) !== v.birthDate) errors.birthDate = "Enter a valid date.";
    else if (v.birthDate > today) errors.birthDate = "Date of birth can't be in the future.";
    else if (v.birthDate < "1900-01-01") errors.birthDate = "Date of birth must be 1900 or later.";
  }
  for (const f of ["given", "family", "gender", "birthDate"]) {
    $(f + "-err").textContent = errors[f] || "";
    $(f).setAttribute("aria-invalid", errors[f] ? "true" : "false");
  }
  return Object.keys(errors).length ? null : v;
}

function buildPatient(v, existing) {
  const given = v.given.split(" ");
  if (!existing) {
    return { resourceType: "Patient", name: [{ use: "official", family: v.family, given }], gender: v.gender, birthDate: v.birthDate };
  }
  // Keep everything else on the resource (identifiers, telecom, extensions, …) intact.
  const p = structuredClone(existing);
  delete p.meta;
  delete p.text;
  p.name = p.name && p.name.length ? p.name : [];
  const n = primaryName(p);
  if (n) {
    n.family = v.family; n.given = given; delete n.text;
  } else {
    p.name.push({ use: "official", family: v.family, given });
  }
  p.gender = v.gender;
  p.birthDate = v.birthDate;
  return p;
}

function banner(text, kind) {
  $("form-banner").innerHTML = "";
  if (!text) return;
  const div = document.createElement("div");
  div.className = "banner " + kind;
  div.textContent = text;
  $("form-banner").appendChild(div);
}

async function startEdit(id) {
  banner("", "");
  try {
    const p = await api(`/api/Patient/${encodeURIComponent(id)}`);
    editing = p;
    const n = primaryName(p) || {};
    $("given").value = (n.given || []).join(" ");
    $("family").value = n.family || "";
    $("gender").value = GENDERS.includes(p.gender) ? p.gender : "";
    $("birthDate").value = p.birthDate && /^\d{4}-\d{2}-\d{2}$/.test(p.birthDate) ? p.birthDate : "";
    for (const f of ["given", "family", "gender", "birthDate"]) { $(f + "-err").textContent = ""; $(f).removeAttribute("aria-invalid"); }
    $("form-title").textContent = `Edit patient ${p.id}`;
    $("submit").textContent = "Save changes";
    $("cancel").hidden = false;
    document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("editing", tr.lastChild.previousSibling.textContent === p.id));
    $("given").focus();
    $("form").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    banner(`Could not load patient: ${err.message}`, "error");
  }
}

function resetForm() {
  editing = null;
  $("form").reset();
  for (const f of ["given", "family", "gender", "birthDate"]) { $(f + "-err").textContent = ""; $(f).removeAttribute("aria-invalid"); }
  $("form-title").textContent = "New patient";
  $("submit").textContent = "Create patient";
  $("cancel").hidden = true;
  document.querySelectorAll("#rows tr.editing").forEach(tr => tr.classList.remove("editing"));
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  banner("", "");
  const v = validate();
  if (!v) return;
  const btn = $("submit");
  btn.disabled = true;
  try {
    if (editing) {
      const body = buildPatient(v, editing);
      const saved = await api(`/api/Patient/${encodeURIComponent(editing.id)}`, { method: "PUT", body: JSON.stringify(body) });
      resetForm();
      banner(`Updated ${displayName(saved || body)}.`, "ok");
    } else {
      const saved = await api("/api/Patient", { method: "POST", body: JSON.stringify(buildPatient(v)) });
      resetForm();
      banner(`Created ${displayName(saved || {})}${saved && saved.id ? ` (ID ${saved.id})` : ""}.`, "ok");
    }
    await loadPatients();
  } catch (err) {
    banner(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});

$("cancel").addEventListener("click", () => { resetForm(); banner("", ""); });
$("refresh").addEventListener("click", loadPatients);
let searchTimer;
$("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadPatients, 300); });

api("/api/config").then(c => { $("server").textContent = c.server; }).catch(() => {});
loadPatients();
</script>
</body>
</html>
