services:
  - type: web
    name: fhirconnect
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FHIR_BASE_URL
        sync: false
      - key: FHIR_BEARER_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
